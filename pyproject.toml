[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climatelens"
version = "0.1.0"
description = "What climate change has already done to one place on Earth, from ERA5 and CMIP6."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nathan Knapp", email = "nathaniel.knapp@gmail.com"}]
keywords = ["climate", "climate-change", "era5", "cmip6", "reanalysis", "fastapi"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
climatelens = "climatelens.api:main"

[tool.setuptools.packages.find]
include = ["climatelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
